name: Build Nexo Installer

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Клонирование репозитория
      uses: actions/checkout@v4

    - name: Установка Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Установка PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Сборка .exe файла (включая index.html)
      run: |
        pyinstaller --onefile --add-data "index.html;." unified_installer.py

    - name: Сохранение готового файла
      uses: actions/upload-artifact@v4
      with:
        name: NexoInstaller
        path: dist/unified_installer.exe
